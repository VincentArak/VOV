server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The service worker and the shell must never be served stale, or a rebuilt
  # image keeps handing back the previous version.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: /world-tree and friends are React Router paths, not
  # files on disk, so anything unmatched falls through to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
