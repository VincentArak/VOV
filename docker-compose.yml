services:
  # Production build: static bundle behind nginx.  http://localhost:8173
  #
  # Port 8173 rather than the usual 8080: 8080 is a crowded port on developer
  # machines (Vivado, Tomcat, other stacks) and a collision shows up as either
  # "port is already allocated" or, worse, someone else's 404 at the URL you
  # expected. Override with VOV_PORT=9000 docker compose up.
  web:
    build:
      context: .
      target: runtime
    image: vov-worldtree:latest
    container_name: vov-worldtree
    ports:
      - "${VOV_PORT:-8173}:80"
    restart: unless-stopped

  # Live-reload development server.  http://localhost:5173
  #   docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: vov-worldtree-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VOV_DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      # Keep the container's node_modules off the Windows bind mount: native
      # binaries built for linux must not be overwritten by the host copy.
      - vov_node_modules:/app/node_modules
    environment:
      # Bind-mounted files on Windows do not emit inotify events.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

volumes:
  vov_node_modules:
