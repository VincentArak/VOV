services:
  # Production build: static bundle behind nginx.  http://localhost:8080
  web:
    build:
      context: .
      target: runtime
    image: vov-worldtree:latest
    container_name: vov-worldtree
    ports:
      - "8080:80"
    restart: unless-stopped

  # Live-reload development server.  http://localhost:5173
  #   docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: vov-worldtree-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the container's node_modules off the Windows bind mount: native
      # binaries built for linux must not be overwritten by the host copy.
      - vov_node_modules:/app/node_modules
    environment:
      # Bind-mounted files on Windows do not emit inotify events.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

volumes:
  vov_node_modules:
